[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldforge"
version = "0.1.0"
description = "Offline-first emergency preparedness and survival operations system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Christopher Ryan"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
fieldforge = "fieldforge.cli:main"
fieldforge-gui = "fieldforge.ui.desktop:run"

[tool.setuptools.packages.find]
include = ["fieldforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
