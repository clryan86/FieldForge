[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldforge"
version = "0.1.0"
description = "Offline-first emergency preparedness and survival operations system"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Christopher Ryan"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6.19.0,<7"]
gps = ["pyserial>=3.5,<4"]
maps = ["Pillow>=12.3,<13"]
commons = ["pyotp==2.9.0", "Pillow>=12.3,<13"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
fieldforge = "fieldforge.cli:main"
fieldforge-gui = "fieldforge.ui.desktop:run"
fieldforge-gps = "fieldforge_gps.__main__:main"
fieldforge-workspace = "fieldforge_gps.live_map_ui:main"
fieldforge-map-portal = "fieldforge.online.server:main"
fieldforge-commons-preview = "fieldforge.online.commons_preview:main"
fieldforge-map-catalog = "fieldforge.online.catalog:main"

[tool.setuptools.packages.find]
include = ["fieldforge*"]

[tool.setuptools.package-data]
fieldforge_gps = ["data/*"]
"fieldforge.online" = ["portal.html", "commons.html", "commons.css", "commons.js", "commons-private.js", "commons-accounts.js", "commons-profiles.js", "commons-owner.html", "commons-owner.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
