name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Desktop GUI tests
        if: runner.os == 'Linux'
        run: xvfb-run -a env FIELDFORGE_REQUIRE_GUI=1 pytest tests/test_knowledge_ui.py -W error::pytest.PytestUnraisableExceptionWarning
      - name: Package smoke test
        shell: bash
        run: |
          python -m build --wheel --outdir dist
          fieldforge --database "$RUNNER_TEMP/fieldforge-ci.db" init
          fieldforge --database "$RUNNER_TEMP/fieldforge-ci.db" scenario power_outage
