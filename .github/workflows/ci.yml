name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Desktop GUI tests
        run: xvfb-run -a env FIELDFORGE_REQUIRE_GUI=1 pytest tests/test_knowledge_ui.py
      - name: Package smoke test
        run: |
          python -m build --wheel --outdir dist || pip install build && python -m build --wheel --outdir dist
          fieldforge --database /tmp/fieldforge-ci.db init
          fieldforge --database /tmp/fieldforge-ci.db scenario power_outage
