name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Package smoke test
        run: |
          python -m build --wheel --outdir dist || pip install build && python -m build --wheel --outdir dist
          fieldforge --database /tmp/fieldforge-ci.db init
          fieldforge --database /tmp/fieldforge-ci.db scenario power_outage

  text-import-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -e ".[dev]"
      - name: Run import and recovery UI integration with a display
        run: |
          xvfb-run -a sh -c 'python -c "import tkinter as tk; root = tk.Tk(); root.destroy()" && python -m pytest -q tests/test_documents_ui.py tests/test_documents_integration.py tests/test_recovery_ui.py tests/test_recovery_integration.py'

  windows-recovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Require functioning Tk
        run: python -c "import tkinter as tk; root = tk.Tk(); root.destroy()"
      - name: Windows snapshot and recovery tests
        run: python -m pytest -q tests/test_snapshot.py tests/test_snapshot_hardening.py tests/test_recovery.py tests/test_recovery_ui.py tests/test_recovery_integration.py
