name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fieldforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-obsolete-branch-checks:
    # Also retires runs created before this branch acquired concurrency groups.
    # Main/release runs and other development branches are never cancelled here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/desktop-blueprint-delivery'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel checks of superseded integration commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=codex%2Fdesktop-blueprint-delivery&per_page=100" --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\" and (.status == \"in_progress\" or .status == \"queued\")) | .id" > older-runs.txt
          while read -r run; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" || true
          done < older-runs.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13.16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,pdf,maps]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Package smoke test
        run: |
          python -m build --wheel --outdir dist || pip install build && python -m build --wheel --outdir dist
          fieldforge --database /tmp/fieldforge-ci.db init
          fieldforge --database /tmp/fieldforge-ci.db scenario power_outage
      - name: Verify bundled lessons from the built wheel, away from source
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/foundation-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -m fieldforge.blueprints --database "$RUNNER_TEMP/blueprints-wheel.db" install-library
          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -m fieldforge.knowledge.foundations export "$RUNNER_TEMP/wheel-foundations.json"
          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -c "import json; from pathlib import Path; import fieldforge.knowledge.foundations as f; assert Path(f.__file__).is_relative_to(Path('foundation-wheel').resolve()); assert len(json.loads(Path('wheel-foundations.json').read_text())['data']['articles']) == 20; print('All 20 lessons exported from installed wheel:', f.__file__)"

          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -c "from importlib.resources import files; from fieldforge.online.client import PortalClient; html = files('fieldforge.online').joinpath('portal.html').read_text(); assert 'FieldForge' in html; client = PortalClient('https://maps.example.org'); assert not client.connected; print('Portal assets and disconnected client verified from installed wheel')"
          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -S -c "from fieldforge.navigation.map_view import Viewport; from fieldforge.navigation.mbtiles import inspect_pack; assert len(Viewport(0, 0, 1, 512, 512).slots()) == 4; print('Offline map core imports without site packages')"
          PYTHONPATH="$RUNNER_TEMP/foundation-wheel" python -c "from pathlib import Path; import fieldforge_gps; from fieldforge_gps.mbtiles import inspect_pack; p = Path(fieldforge_gps.__file__); assert p.is_relative_to(Path('foundation-wheel').resolve()); data = p.parent / 'data'; assert inspect_pack(data / 'FICTIONAL-MAP.mbtiles', consent=True).levels; assert (data / 'FICTIONAL-PLACES.csv').is_file(); print('GPS package and map/place fixtures verified from installed wheel:', p)"

  text-import-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -e ".[dev,pdf,maps]"
      - name: Run local workflows, emergency, binder and recreation UI integration
        env:
          FIELDFORGE_REQUIRE_GUI: "1"
        run: |
          xvfb-run -a sh -c 'python -c "import tkinter as tk; root = tk.Tk(); root.destroy()" && python -m pytest -o addopts="" --capture=sys -q --tb=short'

  windows-recovery:
    # Keep native Windows/Tcl standard handles stable across test-root teardown.
    # Python output is captured; native output remains visible in the job log.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13.16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,pdf,maps]"
      - name: Require functioning Tk
        run: python -c "import pypdf; print(pypdf.__version__); import tkinter as tk; root = tk.Tk(); root.destroy()"
      - name: Windows local-data, emergency, binder and recreation workflow tests
        env:
          FIELDFORGE_REQUIRE_GUI: "1"
        run: python -m pytest -o addopts='' --capture=sys -vv --tb=short -ra tests/test_snapshot.py tests/test_snapshot_hardening.py tests/test_recovery.py tests/test_recovery_ui.py tests/test_recovery_integration.py tests/test_supplies.py tests/test_supplies_ui.py tests/test_supplies_integration.py tests/test_household.py tests/test_household_ui.py tests/test_household_integration.py tests/test_emergency.py tests/test_emergency_ui.py tests/test_emergency_integration.py tests/test_binder.py tests/test_binder_ui.py tests/test_binder_integration.py tests/test_emergency_actions.py tests/test_emergency_actions_ui.py tests/test_emergency_actions_integration.py tests/test_pdf_import.py tests/test_pdf_import_ui.py tests/test_pdf_import_integration.py tests/test_recreation.py tests/test_recreation_ui.py tests/test_recreation_integration.py tests/test_reading_links.py tests/test_reading_links_ui.py tests/test_reading_links_integration.py tests/test_pathways.py tests/test_pathways_ui.py tests/test_pathways_integration.py tests/test_pocket.py tests/test_pocket_ui.py tests/test_foundations.py tests/test_foundations_ui.py tests/test_foundations_integration.py tests/test_originals.py tests/test_originals_ui.py tests/test_originals_integration.py tests/test_places.py tests/test_gpx.py tests/test_places_ui.py tests/test_places_integration.py tests/test_maps.py tests/test_maps_ui.py tests/test_maps_integration.py tests/test_packaged_runtime.py tests/test_packaged_ui.py

  windows-maps:
    # As above, avoid pytest's fd-level handle replacement between Tk interpreters.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13.16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,pdf,maps]"
      - name: Require map, image and GPS workflows on Windows
        env:
          FIELDFORGE_REQUIRE_GUI: "1"
        run: python -m pytest -o addopts='' --capture=sys -vv --tb=short -ra tests/test_gps_desktop.py tests/test_raster_maps.py tests/test_image_maps_ui.py tests/test_map_file_identity.py tests/test_packaged_ui.py tests/test_windows_build_inputs.py tests/test_online_maps_ui.py tests/test_online_compat_ui.py tests/test_online_portal.py tests/test_portal_catalog.py tests/test_portal_connection.py tests/test_map_download_list.py tests/test_online_resume.py tests/test_online_integration.py tests/test_route_overlay_ui.py tests/gps_addon

  pocket-browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test tools and map image support
        run: python -m pip install -e ".[dev,maps]" "playwright==1.57.0"
      - name: Install the selected browser and system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Require offline reader and map portal browser workflows
        env:
          FIELDFORGE_BROWSER_TESTS: "1"
          FIELDFORGE_BROWSER: ${{ matrix.browser }}
          FIELDFORGE_BROWSER_MODE: "file"
          FIELDFORGE_PORTAL_BROWSER_TESTS: "1"
        run: python -m pytest -o addopts='' -q -ra -s tests/test_pocket_browser.py tests/test_online_portal_browser.py

  windows-portable:
    needs: [test, text-import-gui, windows-recovery, windows-maps, pocket-browser, windows-blueprints]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          architecture: "x64"
          cache: pip
      - name: Install explicit packaging dependencies
        run: python -m pip install -e ".[pdf,gps,maps]" "pyinstaller==6.22.3"
      - name: Build and verify relocated standalone Windows executables
        env:
          FIELDFORGE_BRANCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/build_windows.py --source-commit "$env:GITHUB_SHA" --branch-commit "$env:FIELDFORGE_BRANCH_COMMIT" --output "$env:RUNNER_TEMP/FieldForge-Windows-Delivery"
      - uses: actions/upload-artifact@v7
        with:
          name: FieldForge-Windows-x64
          path: |
            ${{ runner.temp }}/FieldForge-Windows-Delivery/FieldForge-Windows-x64.zip
            ${{ runner.temp }}/FieldForge-Windows-Delivery/FieldForge-Windows-x64.sha256
            ${{ runner.temp }}/FieldForge-Windows-Delivery/FieldForge-Windows-Verification.json
          if-no-files-found: error
          retention-days: 14

  source-bundle:
    needs: [test, text-import-gui, windows-recovery, pocket-browser, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive the tested source commit, not runtime data
        run: |
          git archive --format=zip --prefix=FieldForge/ --output="$RUNNER_TEMP/FieldForge-Development.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/FieldForge-Source-Commit.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: FieldForge-Development-Source
          path: |
            ${{ runner.temp }}/FieldForge-Development.zip
            ${{ runner.temp }}/FieldForge-Source-Commit.txt
          if-no-files-found: error
          retention-days: 14

  windows-blueprints:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,pdf,maps]"
      - name: Blueprint desktop, imports and archive compatibility
        env:
          FIELDFORGE_REQUIRE_GUI: "1"
        run: python -m pytest -o addopts='' --capture=sys -q -ra tests/test_guided_numbers.py tests/test_guided_evidence.py tests/test_guided_literacy.py tests/test_education_studio.py tests/test_blueprint_delivery.py tests/test_knowledge_ui.py tests/test_blueprints.py tests/test_blueprint_acceptance.py tests/test_blueprint_clearance.py tests/test_blueprint_comparison.py tests/test_blueprint_diagnostics.py tests/test_blueprint_drawings.py tests/test_blueprint_evidence.py tests/test_blueprint_geometry.py tests/test_blueprint_parameters.py tests/test_blueprint_projects.py tests/test_blueprint_review_files.py tests/test_blueprint_revision.py tests/test_local_model.py tests/test_database_archive.py tests/test_reference_library.py tests/test_education_library.py

  windows-download:
    # Publish only the verified build of main, never a pull request's code/token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-portable, source-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FieldForge-Windows-x64
          path: delivery
      - name: Check artifact identity and checksum
        working-directory: delivery
        run: |
          sha256sum --check FieldForge-Windows-x64.sha256
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('FieldForge-Windows-Verification.json').read_text())
          assert report['status'] == 'passed' and report['packaged']
          assert report['build']['source_commit'] == os.environ['GITHUB_SHA']
          assert report['relocated_away_from_source'] and report['inherited_user_data_untouched']
          assert len(report['checks']) == 10
          PY
      - name: Publish downloadable development build
        working-directory: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="desktop-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > RELEASE.txt <<'NOTES'
          Download **FieldForge-Windows-x64.zip**, extract the entire folder, then open **FieldForge.exe**. Python is included.

          **Education** now starts with **Guided: Numbers & operations**: six lessons on counting, place value, addition, subtraction, multiplication and division. Follow 18 worked diagram steps, then try 36 exercises with specific numeric/choice feedback and self-reviewed explanations. Worksheets include every diagram step. All 590 existing question identities are preserved; **Resume saved practice** reopens earlier work. The measurement, reading/writing and evidence courses and all 172 reference lessons remain available. No model or internet connection is needed.

          **Blueprints** is beside Dashboard. Choose **Create layout from dimensions** to enter parts and generate drawings without an AI model. Save, edit and export from the engineering workspace. The optional AI makers require a separately installed local Ollama model.

          This is an unsigned development build. Drawings show rectangular part envelopes; structural analysis, joints and fabrication-ready CAD are not implemented. AI design quality and education learning outcomes have not been independently evaluated. Preserve your existing database; the download contains no personal records. See the included READ-ME-FIRST.txt and VERIFICATION.json.
          NOTES
          gh release create "$tag" FieldForge-Windows-x64.zip FieldForge-Windows-x64.sha256 FieldForge-Windows-Verification.json --target "$GITHUB_SHA" --title "FieldForge Windows development build ${GITHUB_RUN_NUMBER}" --prerelease --draft --notes-file RELEASE.txt
          gh release edit "$tag" --draft=false
