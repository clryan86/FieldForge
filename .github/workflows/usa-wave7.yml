name: USA map sources wave seven
on:
  push:
    branches: [chatgpt/usa-batch-wave7-20261003]
    paths: [.github/workflows/usa-wave7.yml]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_usa_acquire.py tests/test_usa_provider_dates.py
      - name: Preserve exact tools and rollout history
        run: |
          mkdir tool-source
          git archive --format=zip --prefix=FieldForge-USA-Tools/ HEAD tools/usa_maps tests .github/workflows/usa-wave7.yml docs/USA_WAVE6_PREPARED_MAPS_20261003.md > tool-source/FieldForge-USA-Wave7-Tools-source.zip
          git rev-parse HEAD > tool-source/source-commit.txt
          sha256sum tool-source/FieldForge-USA-Wave7-Tools-source.zip > tool-source/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fieldforge-usa-wave7-tool-source
          path: tool-source/
          retention-days: 14
  acquire:
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: [kentucky, louisiana, missouri, wisconsin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire bounded public source and verify saved snapshot
        run: |
          mkdir usa-acquisition
          python tools/usa_maps/acquire.py --output usa-acquisition --region '${{ matrix.region }}' --max-mib 384
          python tools/usa_maps/acquire.py --output usa-acquisition --region '${{ matrix.region }}' --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: fieldforge-usa-wave7-${{ matrix.region }}
          path: usa-acquisition/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
